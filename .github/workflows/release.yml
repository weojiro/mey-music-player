name: Release

# Runs when you publish a release on GitHub (Releases -> Draft a new release -> Publish release).
# It builds MMP.exe for that version and attaches MMP.exe, MMP.exe.gz, MMP.exe.sha256 and MMP.zip to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          # one self-contained MMP.exe (the .NET runtime inside); the publish settings are in MMP.csproj
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          dotnet publish src/MMP.csproj -c Release -p:Version=$version -o out
          $hash = (Get-FileHash out/MMP.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MMP.exe" | Out-File -FilePath out/MMP.exe.sha256 -Encoding ascii
          # the same exe gzipped (less than half the size): the updater and the launcher download this one
          $in = [IO.File]::OpenRead("$PWD/out/MMP.exe")
          $gz = [IO.Compression.GZipStream]::new([IO.File]::Create("$PWD/out/MMP.exe.gz"), [IO.Compression.CompressionLevel]::SmallestSize)
          $in.CopyTo($gz); $gz.Dispose(); $in.Dispose()
          Compress-Archive -Path launcher/* -DestinationPath out/MMP.zip

      - name: Attach files to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/MMP.exe out/MMP.exe.gz out/MMP.exe.sha256 out/MMP.zip --clobber
      
