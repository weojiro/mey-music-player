name: Release

# Runs when you publish a release on GitHub (Releases -> Draft a new release -> Publish release).
# It builds MMP.exe for that version and attaches MMP.exe, MMP.exe.sha256 and MMP.zip to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          dotnet publish src/MMP.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false `
            -p:Version=$version -o out
          $hash = (Get-FileHash out/MMP.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MMP.exe" | Out-File -FilePath out/MMP.exe.sha256 -Encoding ascii
          Compress-Archive -Path launcher/* -DestinationPath out/MMP.zip

      - name: Attach files to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/MMP.exe out/MMP.exe.sha256 out/MMP.zip --clobber
